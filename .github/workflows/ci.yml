name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Run ShellCheck
      uses: ludeeus/action-shellcheck@master
      with:
        scandir: './scripts'
      env:
        SHELLCHECK_OPTS: -e SC1071

  test-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Test script syntax
      run: |
        bash -n scripts/deploy.sh
        bash -n scripts/dispatch.sh
        bash -n scripts/fleet-status.sh
    
    - name: Check config template validity
      run: |
        python3 -c "import json; json.load(open('config/picoclaw-fleet.json.example'))" || true

  validate-docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Check documentation
      run: |
        test -f SKILL.md
        test -f README.md
        test -f LICENSE
